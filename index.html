@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
:root{--bg:#ECF1EF;--surface:#FFFFFF;--surface-2:#F4F7F6;--ink:#13201E;--muted:#56655F;--line:#D2DCD8;--primary:#0E5E52;--primary-ink:#FFFFFF;--tomato:#C2412A;--visor:#13201E;--visor-ink:#F6C453;
  --f-display:"Big Shoulders Display","Arial Narrow",sans-serif;--f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1417;--surface:#122025;--surface-2:#172A30;--ink:#E3EDEA;--muted:#9BAEA9;--line:#25383E;--primary:#5FCDAE;--primary-ink:#05231C;--tomato:#FF7D64;--visor:#060E10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1417;--surface:#122025;--surface-2:#172A30;--ink:#E3EDEA;--muted:#9BAEA9;--line:#25383E;--primary:#5FCDAE;--primary-ink:#05231C;--tomato:#FF7D64;--visor:#060E10;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.gate{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.mark{width:88px;height:88px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem}
form{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left}
label{font-weight:700;font-size:.88rem;color:var(--muted)}
input[type=password]{width:100%;min-height:50px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:1.05rem}
input[type=password]:focus-visible,button:focus-visible,.rem input:focus-visible{outline:3px solid #F2B134;outline-offset:2px}
.rem{display:flex;align-items:center;gap:10px;font-weight:400;color:var(--ink);font-size:.92rem;min-height:40px}
.rem input{width:20px;height:20px;accent-color:var(--primary)}
button{min-height:50px;border:0;border-radius:999px;background:var(--primary);color:var(--primary-ink);font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.err{margin:0;color:var(--tomato);font-size:.9rem;font-weight:700}
.note{margin:0;color:var(--muted);font-size:.8rem}
</style>
</head>

<main class="gate" id="gate" hidden>

    <label class="rem"><input id="rem" type="checkbox" checked> Lembrar neste aparelho</label>
    <button id="go" type="submit">Abrir</button>
    <p id="msg" class="err" role="alert" hidden></p>
    <p class="note">O conteúdo deste app fica criptografado e só abre com a senha.</p>
  </form>
</main>

<script>
(() => {
  "use strict";
  const P = { salt: "N/hToSYqtxEE5BqYXy3I7w==", iv: "jzMiEkABGFBUi5WA", it: 1000000 };
  const DB = "recomp-gate", $ = id => document.getElementById(id);
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  // chave guardada só neste aparelho, como CryptoKey não exportável (o valor da chave não pode ser lido)
  function store(mode, fn) {
    return new Promise((resolve, reject) => {
      let req; try { req = indexedDB.open(DB, 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => req.result.createObjectStore("k");
      req.onerror = () => reject(req.error);
      req.onsuccess = () => {
        const db = req.result, tx = db.transaction("k", mode), q = fn(tx.objectStore("k"));
        tx.oncomplete = () => { db.close(); resolve(q && q.result); };
        tx.onerror = () => { db.close(); reject(tx.error); };
      };
    });
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function decrypt(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes($("payload").textContent.trim()));
    return new TextDecoder().decode(plain);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function ask(msg) {
    $("gate").hidden = false;
    if (msg) { $("msg").textContent = msg; $("msg").hidden = false; }
    setTimeout(() => $("pw").focus(), 50);
  }
  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = $("pw").value; if (!pw) { ask("Digite a senha."); return; }
    $("go").disabled = true; $("go").textContent = "Abrindo…"; $("msg").hidden = true;
    let key, html;
    try { key = await derive(pw); html = await decrypt(key); }
    catch (err) { $("go").disabled = false; $("go").textContent = "Abrir"; $("pw").select(); ask("Senha incorreta. Tente de novo."); return; }
    $("pw").value = "";
    if ($("rem").checked) { try { await store("readwrite", s => s.put(key, P.salt)); } catch (err) { /* sem lembrar neste navegador */ } }
    show(html);
  });
  (async () => {
    if (!window.crypto || !crypto.subtle) { ask("Este navegador não consegue abrir o app. Use o Safari ou o Chrome atualizados."); return; }
    let key = null;
    try { key = await store("readonly", s => s.get(P.salt)); } catch (e) { key = null; }
    if (key) { try { show(await decrypt(key)); return; } catch (e) { try { await store("readwrite", s => s.delete(P.salt)); } catch (e2) {} } }
    ask();
  })();
})();
</script>
